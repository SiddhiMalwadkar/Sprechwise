<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Text Translator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container py-5">
  <h1 class="text-center fw-bold mb-3">Instant Text Translator</h1>
  <p class="text-center text-muted mb-4">Instant translations at your fingertips.</p>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card p-4 shadow-sm">

        <!-- Flask Form for Translation -->
        <form method="POST">
          <div class="mb-3">
            <label for="source-language" class="form-label">From:</label>
            <select name="source_lang" id="source-language" class="form-select mb-2">
              <option value="en" {% if source_lang == 'en' %}selected{% endif %}>English</option>
              <option value="de" {% if source_lang == 'de' %}selected{% endif %}>German</option>
            </select>
            <textarea name="input_text" class="form-control" rows="5" placeholder="Type your text here...">{{ input_text }}</textarea>
          </div>

          <button type="submit" class="btn btn-primary">Translate</button>
          <button type="submit" name="clear" value="1" class="btn btn-secondary">Clear</button>
        </form>

        <div class="mt-3">
          <label for="translated-text" class="form-label">Translated Text:</label>
          <textarea class="form-control" rows="5" readonly>{{ translated_text }}</textarea>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
