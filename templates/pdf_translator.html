<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Translator & Summarizer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f0f4f7; }
        h1 { text-align: center; color: #333; }
        form { margin: auto; width: 50%; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input[type=file], select, button { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #007bff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin-top: 20px; padding: 20px; background: #e9f7ef; border-left: 5px solid #28a745; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>PDF Translator & Summarizer</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="pdf" required>
        <select name="action" required>
            <option value="translate">Translate</option>
            <option value="summarize">Summarize</option>
        </select>
        <select name="lang">
            <option value="en-de">English → German</option>
            <option value="de-en">German → English</option>
        </select>
        <button type="submit">Process PDF</button>
    </form>

    {% if result %}
    <div class="result">
        <pre>{{ result }}</pre>
    </div>
    {% endif %}
</body>
</html>
